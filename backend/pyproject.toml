[project]
name = "wellness"
version = "0.1.0"
description = "Wellness app backend: biometric ingestion, arousal scoring, and notifications"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.6",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wellness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# wellness.db builds one AsyncEngine (and its asyncpg connection pool) at
# import time, shared for the whole process. asyncpg connections are bound
# to the event loop that created them, so every test must run on the same
# loop — the default per-test loop would otherwise reuse pooled connections
# across closed loops and fail with "Event loop is closed".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom requires Depends()/Query() as literal
# argument defaults; they're evaluated once at route-registration time, not
# per-request, so B008's "don't call functions in defaults" doesn't apply.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true
