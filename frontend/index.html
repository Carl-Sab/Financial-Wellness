<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Wellness — Mood/Spend Correlation</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
  <div class="page">
    <header>
      <h1>Mood / Arousal vs. Excess Spend</h1>
      <p class="subtitle">
        Correlates how someone feels at the moment of a purchase (happiness, sadness, arousal)
        against how much more than usual they spent — then optionally asks an AI to write it up.
      </p>
    </header>

    <form id="analysis-form" class="controls">
      <div class="field">
        <label for="user-id">User ID <span class="hint">(optional — leave blank for all users)</span></label>
        <input type="text" id="user-id" placeholder="e.g. 6bb71316-7dc5-486d-bcfa-882bb814f8e5" />
      </div>
      <label class="checkbox-field">
        <input type="checkbox" id="include-ai-report" />
        Include AI report <span class="hint">(slower, calls Claude)</span>
      </label>
      <button type="submit" id="run-btn">Run Analysis</button>
    </form>

    <p id="status" class="status"></p>

    <section id="results" class="results hidden">
      <h2>Correlation results</h2>
      <p id="transaction-count" class="muted"></p>
      <table id="correlation-table">
        <thead>
          <tr><th>Mood / arousal</th><th>Pearson r</th><th>p-value</th><th>n</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="plots">
        <img id="scatter-plot" alt="Mood vs. excess spend scatter plots" />
        <img id="bar-plot" alt="Correlation strength bar chart" />
      </div>

      <div id="ai-report-section" class="ai-report hidden">
        <h2>AI report</h2>
        <div id="ai-report-content"></div>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
